schema_version: 1

common:
  stages: [1, 2, 3, 4, 5, 6]
  public_web_access: allowed
  max_source_attempts: 3
  retryable_http_statuses: [408, 429, 500, 502, 503, 504]
  external_blocker_policy:
    use_fallback_sources: true
    record_gap: true
    continue_when_noncritical: true
    bypass_login_captcha_paywall: false
  completion_gates:
    - report/research_report.md
    - report/research_report.html
    - data/citations.csv
    - data/source_data.csv
    - evidence/evidence_matrix.csv
    - evidence/controversy_matrix.csv
    - evidence/research_gaps.md
    - qc_strict_passed

modes:
  normal:
    aliases: [normal, regular, 常规, 常规模式]
    checkpoints_after: [1, 2, 3]
    stop_after_stage: null
    workflow_prompts: content_confirmation
  plan:
    aliases: [plan, 计划, 计划模式]
    checkpoints_after: [3]
    stop_after_stage: 3
    workflow_prompts: outline_revision_only
  execute:
    aliases: [execute, execution, 执行, 执行模式]
    checkpoints_after: []
    stop_after_stage: 6
    workflow_prompts: none
